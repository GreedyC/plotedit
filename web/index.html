<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>plotedit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /* ------------------------------------------------------------------
       MATERIAL DESIGN 3, in the Twin Oaks palette.

       ⭐ Jerry, 2026.09.24: "can we use material standards." These are M3's
       own structures — colour ROLES rather than colour names, the type scale,
       the elevation levels, the state layers, the shape scale — written out
       rather than pulled in as a framework. A component library would have to
       be fought at every point where this app is a drawing surface rather than
       a form, and the parts of M3 that make a UI legible are the tokens.

       ⚠ NOT M3's default palette. Its baseline is purple, and the fallback
       everything drifts to is a blue-grey — which the brand rules rule out by
       name. The roles are generated from the logo instead: dark green #256948
       is primary, brown #994C00 is secondary, light green #8CC63F is tertiary.
       Surfaces are warm greys, not cool ones, for the same reason.
       ------------------------------------------------------------------ */
    :root {
      /* colour roles */
      --primary:#256948; --on-primary:#ffffff;
      --primary-container:#a8d5bf; --on-primary-container:#00210f;
      --secondary:#994C00; --on-secondary:#ffffff;
      --secondary-container:#ffdcc2; --on-secondary-container:#301400;
      --tertiary:#4c6524; --on-tertiary:#ffffff;
      --tertiary-container:#cdeb9c; --on-tertiary-container:#101f00;
      --error:#8f2d16; --on-error:#ffffff;
      --error-container:#ffdad3; --on-error-container:#3b0906;

      --surface:#fcf9f6;
      --surface-container-lowest:#ffffff;
      --surface-container-low:#f7f3ef;
      --surface-container:#f1ede8;
      --surface-container-high:#ebe7e2;
      --on-surface:#1c1b19;
      --on-surface-variant:#4d4640;      /* secondary text — the M3 role for it */
      --outline:#7e766e;
      --outline-variant:#d3c9c0;

      /* elevation (M3 levels 1 and 2) */
      --elev-1:0 1px 2px rgba(0,0,0,.30), 0 1px 3px 1px rgba(0,0,0,.15);
      --elev-2:0 1px 2px rgba(0,0,0,.30), 0 2px 6px 2px rgba(0,0,0,.15);

      /* shape scale */
      --shape-xs:4px; --shape-s:8px; --shape-m:12px; --shape-l:16px; --shape-full:100px;
    }
    * { box-sizing:border-box; }
    body {
      margin:0; background:var(--surface); color:var(--on-surface);
      font-family:Roboto,system-ui,sans-serif;
      /* M3 body-medium */
      font-size:14px; line-height:20px; letter-spacing:.25px;
      display:grid; grid-template-rows:auto 1fr; height:100vh;
    }
    .material-symbols-outlined {
      font-family:"Material Symbols Outlined"; font-weight:normal; font-style:normal;
      font-size:18px; line-height:1; letter-spacing:normal; display:inline-block;
      white-space:nowrap; direction:ltr; -webkit-font-feature-settings:'liga';
      -webkit-font-smoothing:antialiased; user-select:none;
    }

    /* ---- top app bar ------------------------------------------------- */
    header { background:var(--surface-container-low); box-shadow:var(--elev-1); z-index:2; }
    .bar { display:flex; gap:16px; align-items:center; padding:8px 16px; flex-wrap:wrap; }
    .bar + .bar { border-top:1px solid var(--outline-variant); padding-top:6px; padding-bottom:6px; }
    /* M3 title-medium */
    h1 { font-size:16px; line-height:24px; letter-spacing:.15px; font-weight:500; margin:0; }
    .venue { color:var(--on-surface-variant); font-size:12px; line-height:16px; letter-spacing:.4px; }
    /* ⭐ Unsaved is a STATE, not a whisper. M3 gives it an error-tinted chip so
       it reads at a glance instead of as one more piece of grey text. */
    #dirty:not(:empty) {
      display:inline-flex; align-items:center; gap:4px;
      background:var(--error-container); color:var(--on-error-container);
      border-radius:var(--shape-full); padding:2px 10px;
      font-size:11px; line-height:16px; letter-spacing:.5px; font-weight:500;
    }
    #status { font-size:12px; line-height:16px; letter-spacing:.4px; max-width:34em; }
    .grow { margin-left:auto; }
    /* 🔴 WRAPS. `.bar` already wrapped, but the group inside it did not, so the
       row overflowed the window instead and the LAST control simply left the
       screen. Found when Ground plan moved to the end of row one at Jerry's
       request: at a 1024px viewport it sat at x=1212–1299, a button that
       existed and could not be seen. A control pushed off the edge is worse
       than a crowded one, because nothing says it is there. */
    .group { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }

    /* 🔴 A <select> SIZES ITSELF TO ITS WIDEST OPTION, and Open's options are
       plot FILE NAMES. It was 332px — a quarter of the whole row — and one plot
       with a long name would push it wider still, taking the toolbar with it.
       The same is true of Sheet, whose longest option is "ARCH E1 (30 x 42 in)".

       ⚠ This is a holding fix. Both become menu buttons in the next step, and a
       menu's width is the menu's problem, not the toolbar's. */
    /* ⚠ Open is a BUTTON now, so nothing it lists can widen the toolbar — that
       was the whole problem, and it is the menu's business instead. Sheet is
       still a select and still sizes to "ARCH E1 (30 x 42 in)". */
    #page { max-width:190px; }
    .divider { width:1px; align-self:stretch; background:var(--outline-variant); margin:0 2px; }

    /* ---- buttons (M3 filled / tonal / outlined / text), dense ---------- */
    button {
      font-family:inherit; font-size:14px; line-height:20px; letter-spacing:.1px; font-weight:500;
      display:inline-flex; align-items:center; gap:6px;
      height:32px; padding:0 14px; border-radius:var(--shape-full);
      white-space:nowrap; flex:0 0 auto;
      border:none; background:none; color:var(--primary); cursor:pointer;
      position:relative; overflow:hidden; transition:box-shadow .15s, background-color .15s;
    }
    /* M3 STATE LAYERS: hover and focus tint the button with its own foreground
       colour at a fixed opacity, rather than each control inventing a shade. */
    button::after {
      content:""; position:absolute; inset:0; background:currentColor;
      opacity:0; transition:opacity .15s; pointer-events:none;
    }
    button:hover::after { opacity:.08; }
    button:focus-visible::after { opacity:.12; }
    button:active::after { opacity:.12; }
    button:focus-visible { outline:2px solid var(--primary); outline-offset:1px; }
    button:disabled { opacity:.38; cursor:default; box-shadow:none; }
    button:disabled::after { opacity:0; }
    button.filled { background:var(--primary); color:var(--on-primary); }
    button.tonal { background:var(--secondary-container); color:var(--on-secondary-container); }
    button.outlined { border:1px solid var(--outline); color:var(--primary); }
    button.icon { width:32px; padding:0; justify-content:center; border-radius:var(--shape-full); }
    button.danger { color:var(--error); }
    button.small { height:28px; padding:0 12px; font-size:12px; letter-spacing:.5px; }

    /* ---- selects and inputs (M3 outlined, dense) ---------------------- */
    select, input[type=text], input[type=number], .filebtn {
      font-family:inherit; font-size:14px; line-height:20px; letter-spacing:.25px;
      color:var(--on-surface); background:var(--surface-container-lowest);
      border:1px solid var(--outline-variant); border-radius:var(--shape-xs);
      height:32px; padding:0 8px;
    }
    select:hover, input:hover { border-color:var(--outline); }
    select:focus, input:focus { outline:none; border-color:var(--primary); box-shadow:inset 0 0 0 1px var(--primary); }
    .filebtn { display:inline-flex; align-items:center; gap:6px; cursor:pointer;
               border-radius:var(--shape-full); padding:0 14px; color:var(--primary);
               font-weight:500; font-size:14px; letter-spacing:.1px; background:none;
               border:1px solid var(--outline); }
    .filebtn:hover { background:rgba(37,105,72,.08); }
    /* A readout, not a control: it states what the PDF will print at, and
       opens the menu that changes it. Quiet enough to be glanced past, present
       enough to be glanced AT. */
    .sheetinfo { height:32px; padding:0 10px; border-radius:var(--shape-xs);
                 flex:0 0 auto;
                 color:var(--on-surface-variant); font-weight:400; font-size:13px;
                 letter-spacing:.25px; gap:4px; }
    .sheetinfo:hover { background:var(--surface-container-high); }
    .sheetinfo .sep { opacity:.5; }

    /* ---- menus (M3 Menus, on the Popover API) --------------------------
       A temporary surface of actions, opened from a button. `popover` puts it in
       the top layer and dismisses it on an outside click, so none of that is
       written here. See menu.ts. */
    .menu {
      min-width:200px; max-width:min(420px, 90vw); max-height:70vh; overflow-y:auto;
      padding:8px 0; margin:0; border:none;
      background:var(--surface-container-low); color:var(--on-surface);
      border-radius:var(--shape-s); box-shadow:var(--elev-2);
    }
    .menu::backdrop { background:transparent; }
    .menu-item {
      display:flex; align-items:center; gap:12px; width:100%;
      height:40px; padding:0 12px; border:none; border-radius:0;
      background:none; color:var(--on-surface); text-align:left;
      font-size:14px; letter-spacing:.1px; font-weight:400; cursor:pointer;
    }
    .menu-item .material-symbols-outlined { font-size:20px; color:var(--on-surface-variant); }
    .menu-label { flex:1 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .menu-trailing { color:var(--on-surface-variant); font-size:12px; flex:0 0 auto; }
    .menu-item:hover { background:var(--surface-container-high); }
    .menu-item:focus-visible { background:var(--surface-container-high); outline:2px solid var(--primary); outline-offset:-2px; }
    /* M3: an item that cannot be used now is DISABLED, not removed. */
    .menu-item:disabled { opacity:.38; cursor:default; background:none; }
    .menu-divider { height:1px; margin:8px 0; background:var(--outline-variant); }
    .menu-heading { padding:6px 12px 4px; font-size:11px; line-height:16px;
                    letter-spacing:.5px; text-transform:uppercase;
                    color:var(--on-surface-variant); }
    /* The chevron is smaller than a leading icon and sits tight to the label. */
    .chev { font-size:18px !important; margin-left:-2px; margin-right:-6px; }
    /* The tick sits in the same slot a leading icon would, so a list of options
       does not shuffle sideways as the chosen one moves. */
    .menu-tick { width:20px; flex:0 0 20px; font-size:18px !important;
                 color:var(--primary) !important; }
    .menu-more { font-size:18px !important; margin-right:-4px;
                 color:var(--on-surface-variant) !important; }

    /* ---- connected toggle group (M3 "segmented"/toggle buttons) --------
       ⭐ The four layer toggles are ONE control. Connecting them says so: a
       single outlined container, hairlines between, and the selected ones
       filled with the primary container colour.

       ⚠ They remain <input type=checkbox> inside <label>, so the accessibility
       and every `.checked` read in main.ts are untouched. This is appearance
       only, which is why it is safe. */
    .toggles { display:inline-flex; align-items:stretch; flex:0 0 auto;
               border:1px solid var(--outline); border-radius:var(--shape-full);
               overflow:hidden; }
    .toggles label { border-radius:0; padding:0 12px; margin:0; height:32px;
                     border-left:1px solid var(--outline-variant); }
    .toggles label:first-child { border-left:none; }
    /* The tick is redundant once the whole chip fills, and it is what made four
       identical squares read as four identical squares. */
    .toggles input[type=checkbox] { position:absolute; opacity:0; width:1px; height:1px; }
    .toggles label:has(input:checked) {
      background:var(--primary-container); color:var(--on-primary-container); font-weight:500; }
    .toggles label:hover { background:var(--surface-container-high); }
    .toggles label:has(input:checked):hover { background:var(--primary-container); filter:brightness(.97); }
    .toggles label:has(input:focus-visible) { outline:2px solid var(--primary); outline-offset:-2px; }

    /* `at …` belongs to `pools`, so it sits tight against the group and goes
       inert — not hidden — when pools is off. */
    .attached { margin-left:2px; }
    .attached.inert { opacity:.38; pointer-events:none; }

    /* The zoom slider and its four buttons are one control for one thing. */
    .zoomgroup { display:inline-flex; align-items:center; gap:4px; flex:0 0 auto;
                 padding:2px 6px; border-radius:var(--shape-full);
                 background:var(--surface-container); }

    /* M3 switch-ish checkbox row: the label is the target, not just the box. */
    .bar label { display:inline-flex; gap:6px; align-items:center;
                 color:var(--on-surface-variant); font-size:13px; letter-spacing:.25px;
                 padding:4px 8px; border-radius:var(--shape-full); cursor:pointer; }
    .bar label:hover { background:var(--surface-container-high); }
    input[type=checkbox] { accent-color:var(--primary); width:16px; height:16px; margin:0; }
    .version { opacity:.5; font-size:.78em; letter-spacing:.02em; white-space:nowrap; }
    /* A build that is not a release says so, and says it in a colour that asks
       to be noticed — running a working copy and reporting it as a release is
       how a bug gets hunted in the wrong source. */
    .version.dev { opacity:.9; color:var(--tertiary, #994C00); font-weight:600; }
    input[type=range] { accent-color:var(--primary); }

    /* ---- the drawing ------------------------------------------------- */
    /* ⭐ The side panel's width is the reader's to choose — dragged at the
       splitter, remembered per browser. A fixed 380px put the positions and
       schedule behind a horizontal scrollbar. */
    main { display:grid; grid-template-columns:minmax(0,1fr) 6px var(--aside-w,380px); overflow:hidden; }
    #splitter { cursor:col-resize; background:var(--outline-variant); touch-action:none;
                transition:background-color .15s; }
    #splitter:hover, #splitter.dragging { background:var(--primary); }
    body.resizing { cursor:col-resize; user-select:none; }
    #canvas { overflow:auto; display:grid; place-items:center; padding:16px; }
    svg { background:#fff; border-radius:var(--shape-s); box-shadow:var(--elev-1); touch-action:none; }
    /* 🔴 THE DRAWING IS NOT TEXT ON A PAGE. Inside the SVG one user unit is one
       FOOT, so the M3 body-medium letter-spacing of .25px inherited from <body>
       came out as a quarter of a foot between every character — "G R I D  D"
       three feet wide across the plot. Anything measured in CSS pixels has to
       be reset at this boundary, not tuned. */
    svg text { letter-spacing:normal; word-spacing:normal; font-weight:normal; }
    svg .hit { cursor:grab; }
    /* ⚠ Not `rect` — an RP-2 symbol is a POLYGON, drawn as <path>, so that rule
       matched nothing for four months and the only visible highlight was a bug
       filling the invisible hit disc. The halo is an element render() adds, so
       it cannot be silently selecting nothing. */
    /* ⚠ A unit that could not be computed. Amber, not red: nothing is WRONG
       with the plot, something is MISSING from it — usually a trim. */
    svg .instrument.uncomputed path,
    svg .instrument.uncomputed line { stroke:#b26a00; }
    svg .instrument.uncomputed circle:not(.hit) { stroke:#b26a00; fill:#b26a00; }
    /* The selected unit's pool. A fill as well as a stroke, because at this
       scale a stroke alone is one dashed line among fifteen — it is the AREA
       that answers "does that light cover the chair". Kept faint, and the pools
       layer sits under the symbols, so nothing it covers is hidden. */
    svg .pool.selected { stroke:var(--primary) !important; stroke-width:.1 !important;
                         stroke-dasharray:none !important;
                         fill:var(--primary) !important; fill-opacity:.10; }
    svg .pool-note.selected { stroke:#b26a00 !important; stroke-width:.2 !important; }
    svg .halo { fill:var(--primary); fill-opacity:.16;
                stroke:var(--primary); stroke-opacity:.9; stroke-width:.08; }
    /* 🔴 :not(.hit). Every symbol carries an INVISIBLE disc a foot across so a
       nine-inch instrument is easy to grab, and this rule was filling it —
       selecting a unit dropped a solid blob over the plot, hiding the very
       symbol it was meant to be pointing at. It was there before, in blue. */
    /* ⭐ THE YOKE DOT IS GONE (Jerry, 2026.09.29) and this rule went with it.
       It existed to tint that one dot — but it matched EVERY circle on the unit,
       so selecting a Lustr also turned its seven §6.16 colour dots green and a
       gobo'd unit turned its gate mark green. Those dots are NOTATION: the
       count is the fixture's colour count, and recolouring them made the
       selection bleed into what the plot is saying. The halo is the selection
       signal and it is enough. */
    /* 🔴 :not(.hit) here too, and for a worse reason than the fill. The hit disc
       carries no stroke-width, so it took SVG's default of 1 — and one user
       unit is one FOOT. A 0.9ft ring with a 1ft stroke is a solid blob nearly
       three feet across sitting on the focus point. It has been there since
       selection was added, in blue, and I described it in this session as an
       "aim ring" rather than recognising it. Nothing in the editor draws one. */
    svg .focus-handle.selected circle:not(.hit) { stroke:var(--primary); }
    /* Belt and braces: a hit target is a target, never ink. */
    svg .hit { fill:transparent !important; stroke:none !important; }

    /* ---- the side panel ---------------------------------------------- */
    /* ⭐ Jerry, 2026.09.24: "it's hard to differentiate the Positions section
       from the Instrument one." They were two identical grey blocks with a hair
       line between them and a small grey heading each. Now each is an M3 CARD
       with its own surface, its own accent colour and an icon — INSTRUMENT is
       green, POSITIONS is brown, SCHEDULE is neutral — and the header carries a
       count or the selection, so a glance says both what the section is and
       what is in it. */
    aside { background:var(--surface-container); overflow:auto; padding:12px;
            display:flex; flex-direction:column; gap:12px; }
    /* ⚠ flex-shrink:0. A flex item shrinks below its content by default, so
       the Instrument card was squeezed to its first field and Positions showed
       one of six — the panel LOOKED empty rather than scrolled. The aside is
       what scrolls; the cards keep their height. */
    /* ⚠ NOT overflow:hidden. It would round the header's corners for free, but
       it also makes each card its own scroll container, and a sticky header
       inside one has nothing to stick to. The corners are set on the header
       instead so the headers can stay put while the panel scrolls. */
    .panel { background:var(--surface-container-lowest); border-radius:var(--shape-m);
             box-shadow:var(--elev-1); flex:0 0 auto; }
    /* ⭐ STICKY. Scroll the side panel and the headings used to leave with the
       content, so halfway down a list of positions there was nothing on screen
       saying which section you were in — which is the complaint that started
       this. The coloured header stays at the top of the panel instead. */
    .panel > summary { background:none; box-shadow:none; display:flex; align-items:center;
                      gap:8px; padding:10px 14px; border-bottom:1px solid var(--outline-variant);
                      position:sticky; top:0; z-index:1;
                      border-radius:var(--shape-m) var(--shape-m) 0 0; }
    .panel > summary { cursor:pointer; user-select:none; list-style:none; }
    .panel > summary::-webkit-details-marker { display:none; }
    .panel > summary:hover { filter:brightness(.97); }
    .panel > summary:focus-visible { outline:2px solid var(--primary); outline-offset:-2px; }
    .panel > summary .material-symbols-outlined { font-size:20px; }
    /* ⭐ The chevron says which way the panel will go, and turns when it does —
       an accordion whose header never changes leaves the reader guessing
       whether the panel is empty or shut. */
    .chevron { transition:transform .18s ease; transform:rotate(-90deg); }
    .panel[open] > summary .chevron { transform:rotate(0deg); }
    /* A closed panel keeps its rounded corners: there is no body under it. */
    .panel:not([open]) > summary { border-bottom:none; border-radius:var(--shape-m); }
    /* ⚠ And it must stop CLAIMING space. The schedule grows to fill the column
       when it is open; closed, it is a header and nothing more, or collapsing
       it would free no room at all — which is the whole point. */
    .panel.schedule:not([open]) { flex:0 0 auto; min-height:0; }
    /* M3 title-small */
    .panel h2 { font-size:14px; line-height:20px; letter-spacing:.1px; font-weight:500;
                margin:0; text-transform:none; color:var(--on-surface); white-space:nowrap; }
    /* ⚠ The chip gives way, not the title. A venue name is long and a section
       heading is the thing that says which panel this is — wrapping "Show &
       Venue" onto two lines to fit the venue in gets it backwards. */
    .panel .count { margin-left:auto; font-size:11px; line-height:16px; letter-spacing:.5px;
                    font-weight:500; padding:2px 8px; border-radius:var(--shape-full);
                    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
                    max-width:52%; }
    .panel .body { padding:12px 14px; border-radius:0 0 var(--shape-m) var(--shape-m);
                   background:var(--surface-container-lowest); }
    /* the accents that tell the sections apart */
    .panel.instrument > summary { background:var(--primary-container); color:var(--on-primary-container); }
    .panel.instrument .count { background:var(--primary); color:var(--on-primary); }
    .panel.positions > summary { background:var(--secondary-container); color:var(--on-secondary-container); }
    .panel.positions .count { background:var(--secondary); color:var(--on-secondary); }
    .panel.details > summary { background:var(--tertiary-container); color:var(--on-tertiary-container); }
    .panel.details .count { background:var(--tertiary); color:var(--on-tertiary); }
    .panel.schedule > summary { background:var(--surface-container-high); color:var(--on-surface); }
    .panel.schedule .count { background:var(--outline); color:#fff; }
    .panel.schedule { flex:1 1 auto; display:flex; flex-direction:column; min-height:220px; }
    .panel.schedule .body { overflow:auto; flex:1; }

    /* ---- instrument fields ------------------------------------------- */
    .fields { display:grid; grid-template-columns:auto 1fr; gap:8px 10px; align-items:center; }
    .fields label { font-size:12px; line-height:16px; letter-spacing:.4px;
                    color:var(--on-surface-variant); justify-self:end; }
    .fields input, .fields select { width:100%; height:32px; }
    .computed { font-size:13px; line-height:18px; background:var(--surface-container-low);
                border-left:3px solid var(--primary); border-radius:var(--shape-xs);
                padding:10px 12px; margin-bottom:12px; }
    .muted { color:var(--on-surface-variant); }
    .warn { color:var(--error); }

    /* A field that does not apply to this unit. Jerry, 2026.09.29: greyed out,
       not hidden — the row keeps its place so the panel does not change shape
       under the cursor, and hovering says why. The cursor is the tell that it
       is inert by design rather than broken: `not-allowed`, and the label dims
       with its input so the pair reads as one dead row. */
    .fields label.inert { opacity:.55; }

    /* 🔴 NOT an inline style, which is how this went wrong. `display:inline-flex`
       written on the element beats the browser's own `[hidden] { display:none }`,
       so the backdrop strip sat in the toolbar, empty, from the moment the app
       loaded. A rule can be overridden by [hidden]; an inline style cannot. */
    #bdbar { display: inline-flex; gap: 6px; align-items: center;
             padding: 2px 8px; border: 1px solid var(--outline-variant);
             border-radius: var(--shape-s); background: var(--surface-container-low); }
    [hidden] { display: none !important; }
    .fields input:disabled, .fields select:disabled {
      opacity:.55; cursor:not-allowed; background:var(--surface-container-low); }

    /* ---- positions --------------------------------------------------- */
    /* ---- a card of fields, in any panel --------------------------------
       🔴 THESE WERE CALLED `.pos-row`, `.pos-field`, `.pos-note` AND
       `.pos-actions`, AND THEY ARE NOT ABOUT POSITIONS. `details.ts` renders
       Show & Venue with the same classes, because the layout is the same — so
       the name described where the CSS was first needed rather than what it is.

       ⚠ That cost three real bugs in one day, all the same shape: "the first
       `.pos-row`" is Show & Venue, not a position.
         · a test wrote 12'-6" into DESIGNER believing it was a trim, and the
           value reached a file before anyone noticed;
         · a later check read the wrong row and reported a position unchanged
           when it had never been touched;
         · and a third read "The Odd Couple" as a position name.
       Each time the code was right and the NAME was lying.

       ⭐ `card` is what it is: a bordered box of fields inside a panel. Nothing
       about it belongs to positions, and now nothing says it does. */
    .card { border:1px solid var(--outline-variant); border-radius:var(--shape-s);
               padding:10px 12px; margin-bottom:10px; display:grid;
               grid-template-columns:repeat(auto-fit,minmax(92px,1fr)); gap:8px 10px;
               background:var(--surface-container-lowest); transition:box-shadow .15s; }
    .card:hover { box-shadow:var(--elev-1); }
    /* ⭐ #78 — the current position, in the panel and on the plan. The tint is
       `--primary-container`, the same one the schedule already uses for the
       selected unit (`tbody tr.sel`), so "this is the one" looks the same
       wherever it is said. */
    .card.selected { background:var(--primary-container);
                     border-color:var(--primary); }
    /* ⚠ The fields stay on the plain surface inside a tinted card. Letting the
       tint run under the inputs makes a text box look disabled. */
    .card.selected input, .card.selected select {
      background:var(--surface-container-lowest); }
    /* The pipe itself. A colour AND a weight, because the plan is black on white
       and a designer may be printing or colour-blind — the line gets visibly
       thicker as well as green. */
    svg g.position.selected line { stroke:var(--primary); stroke-width:0.55; }
    svg g.position.selected circle,
    svg g.position.selected rect { stroke:var(--primary); }
    /* ⚠ Except the hit line, which is invisible and must stay that way. */
    svg g.position.selected line[stroke="transparent"] { stroke:transparent; }
    svg g.position { cursor:pointer; }
    .card-field { display:flex; flex-direction:column; gap:2px; }
    .card-field.wide { grid-column:1/-1; }
    /* A sub-heading inside a card, for the groups in Show & Venue. M3 label-small. */
    .group-label { grid-column:1/-1; margin:0 0 2px; font-size:11px; line-height:16px;
                   letter-spacing:.5px; font-weight:500; text-transform:uppercase;
                   color:var(--on-surface-variant); }
    .card-field span { font-size:11px; line-height:16px; letter-spacing:.5px;
                      color:var(--on-surface-variant); }
    .card-field input, .card-field select { font-size:13px; height:30px; }
    .card-note { grid-column:1/-1; margin:2px 0 0; font-size:11px; line-height:16px; }
    /* 🔴 WRAP, because this row has always been too wide and nobody had measured
       it. Five buttons need 431px as main shipped them — with no icons at all —
       inside a panel that is 302px by default, so `renumber` and `number by
       clicking` were CLIPPED, not just tight. And the panel is resizable at the
       splitter, so there is no width at which nowrap is safe.

       ⚠ M3's own advice for a row this full is an overflow menu — "don't clutter
       your UI with too many buttons… consider presenting low-priority actions in
       overflow menus or as icon buttons". That is the right end state and it
       needs the menu component, so it waits for that step. Wrapping is what makes
       the row honest in the meantime: a second line is visible, a clipped button
       is not. */
    .card-actions { grid-column:1/-1; display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
    /* ⚠ The size rule that used to live here duplicated `.small` exactly —
       height, padding, font-size and letter-spacing, all written out a second
       time. That is how the panel became a third control height. The buttons
       now ask for `small` themselves (see `button.ts`), so there is one
       definition of what dense means. What stays here is only LAYOUT. */
    .card-actions .material-symbols-outlined { font-size:16px; }
    #positions > button { margin-top:4px; }

    /* ---- schedule ---------------------------------------------------- */
    table { border-collapse:collapse; width:100%; font-size:12px; line-height:16px; }
    th { text-align:left; font-weight:500; letter-spacing:.5px; color:var(--on-surface-variant);
         border-bottom:1px solid var(--outline-variant); padding:6px 8px 6px 0;
         position:sticky; top:0; background:var(--surface-container-lowest); }
    td { padding:6px 8px 6px 0; border-bottom:1px solid var(--surface-container); white-space:nowrap; }
    td.num { text-align:right; font-variant-numeric:tabular-nums; }
    tbody tr { cursor:pointer; }
    tbody tr:hover { background:var(--surface-container-low); }
    tbody tr.sel { background:var(--primary-container); }
    tbody tr.warn td:first-child::before { content:"⚠ "; }
    #err { color:var(--error); padding:16px; white-space:pre-wrap;
           font-family:ui-monospace,monospace; }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <h1 id="show">plotedit</h1>
      <span class="venue" id="venue"></span>
      <span id="dirty"></span>
      <span id="status" class="muted"></span>
      <!-- ⭐ Which build this is. A tester who finds something has to be able to
           say which version they saw it in, and until now nothing in the
           download said. Sits by the show name, muted, out of the way until
           somebody goes looking for it. -->
      <span id="version" class="version" title="Which build this is. Quote it if you report something."></span>
      <div class="group grow">
        <button id="undo" class="icon" title="Undo (⌘Z)" disabled>
          <span class="material-symbols-outlined">undo</span></button>
        <button id="redo" class="icon" title="Redo (⇧⌘Z)" disabled>
          <span class="material-symbols-outlined">redo</span></button>
        <div class="divider"></div>
        <button id="new" class="outlined" title="New plot (start over)">
          <span class="material-symbols-outlined">note_add</span>New</button>
        <button id="open" class="outlined" title="Open a saved plot" aria-haspopup="menu" aria-expanded="false">
          <span class="material-symbols-outlined" aria-hidden="true">folder_open</span>Open…<span class="chev material-symbols-outlined" aria-hidden="true">arrow_drop_down</span></button>
        <button id="save" class="filled" title="Save (⌘S)">
          <span class="material-symbols-outlined">save</span>Save</button>
        <button id="saveas" class="outlined" title="Save As… (⇧⌘S)">
          <span class="material-symbols-outlined">save_as</span>Save As…</button>
        <!-- ⭐ #56: "a revert to return the file to the way it was before we
             touched it in this session". Disabled when there is nothing to go
             back from — the same rule Save follows, and M3's rule for a control
             that cannot act. -->
        <button id="revert" title="Reload the plot from disk, dropping every change since">
          <span class="material-symbols-outlined" aria-hidden="true">history</span>Revert</button>
        <div class="divider"></div>
        <button id="export" class="outlined" title="Export a drawing or a paperwork file" aria-haspopup="menu" aria-expanded="false">
          <span class="material-symbols-outlined" aria-hidden="true">ios_share</span>Export…<span class="chev material-symbols-outlined" aria-hidden="true">arrow_drop_down</span></button>
        <div class="divider"></div>
        <!-- ⭐ Jerry, 2026-10-01: "we use a button for the ground plan. but we
             could move that to the end of the buttons." It is a FILE action —
             it was only in the second row because that is where things went. -->
        <label class="filebtn" title="Import a venue ground plan to trace over — a DXF, or a PDF page">
          <span class="material-symbols-outlined" aria-hidden="true">upload_file</span>
          <input type="file" id="dxf" accept=".dxf,.pdf" hidden> Ground plan…
        </label>
      </div>
    </div>
    <div class="bar">
      <span id="bdbar" hidden>
        <span id="bdwhat" class="muted" style="font-size:12px">backdrop</span>
        <label class="muted" style="font-size:12px" title="Move the backdrop left or right, in feet">x <input id="bdx" type="text" value="0'" style="width:56px"></label>
        <label class="muted" style="font-size:12px" title="Move the backdrop upstage or downstage, in feet">y <input id="bdy" type="text" value="0'" style="width:56px"></label>
        <label class="muted" style="font-size:12px" title="How wide the backdrop is in real feet. Calibrate sets this for you.">wide <input id="bdw" type="text" style="width:62px"></label>
        <label class="muted" style="font-size:12px" title="Rotate the backdrop, in degrees, to square it to the room">turn <input id="bdr" type="number" value="0" step="0.5" style="width:56px"></label>
        <label class="muted" style="font-size:12px" title="How strongly the backdrop shows through. It is a tracing guide, never a measurement.">fade <input id="bdo" type="range" min="10" max="100" value="45" style="width:70px"></label>
        <button id="bdcal" class="small outlined" title="Click two points you know the distance between">calibrate</button>
        <button id="bdoff" class="small outlined" title="Remove the backdrop">remove</button>
      </span>
      <!-- ⭐ ONE GROUP, because they are ONE FUNCTION. Jerry, 2026-10-01: "The
           plan, pools, focus, and labels checkboxes are just strewn across.
           Maybe we can group them by function?" Each of the four shows or hides
           a LAYER of the drawing — so grouping by function groups all four
           together rather than splitting them up.

           ⚠ STILL CHECKBOXES. They look like M3's connected toggle buttons, but
           a checkbox is what they are: on or off, announced correctly, and
           `main.ts` reads `.checked` on every one. Swapping in <div>s would have
           bought the same appearance and cost the semantics. -->
      <span class="toggles" role="group" aria-label="Layers to draw">
        <!-- 🔴 THE SIX HERE MUST MATCH SCREEN_LAYERS IN src/layers.ts, and
             layers.test.ts fails if they drift. This markup is a SECOND COPY of
             that list; the lamp dropdown was a second copy of LAMP_MF and fell
             a whole release behind it, twice, because nothing compared them.
             Order is draw order, bottom of the drawing to the top. -->
        <label title="Draw the imported ground plan under the plot"><input type="checkbox" id="layer-base" checked> plan</label>
        <label title="Draw each light's pool where it lands"><input type="checkbox" id="layer-pools" checked> pools</label>
        <label title="Draw the pipes, booms and their mounts"><input type="checkbox" id="layer-positions" checked> positions</label>
        <label title="Draw the focus point and its leader line"><input type="checkbox" id="layer-focus" checked> focus</label>
        <label title="Draw the instrument symbols. Switch off to read the pipes alone"><input type="checkbox" id="layer-units" checked> units</label>
        <label title="Draw unit numbers, channels, colour and type"><input type="checkbox" id="layer-labels" checked> labels</label>
      </span>
      <!-- ⚠ NOT a fifth peer. It says what height the pools are cut at, so it
           belongs to `pools` — it used to sit between `pools` and `focus` and
           read as one of them. It goes INERT when pools is off rather than
           vanishing, per DECISIONS.md: "Fields that do not apply go inert, not
           hidden." -->
      <label class="attached" id="poolplane-label" title="The height the pools are measured at. A cone cuts a bigger ellipse low down than at head height.">at <select id="poolplane">
        <option value="">head 5'-6"</option>
        <option value="5.1667">face 5'-2"</option>
        <option value="3.5">seated 3'-6"</option>
        <option value="0">the deck</option>
      </select></label>
      <div class="divider"></div>
      <!-- ⭐ "the drawing zoom, and the icons to the right seem to make sense
           together but maybe we could group them somehow." They are one control
           for one thing, so they get one container and one label. -->
      <span class="zoomgroup" role="group" aria-label="Zoom">
      <label title="How many screen pixels one foot is drawn at">drawing zoom: <span class="material-symbols-outlined" aria-hidden="true">zoom_in</span>
        <input type="range" id="zoom" min="2" max="40" step="0.5" value="14"></label>
      <div class="group">
        <button id="zoom-page" class="icon" title="Fit the whole plot">
          <span class="material-symbols-outlined">fit_screen</span></button>
        <button id="zoom-height" class="icon" title="Fit to height">
          <span class="material-symbols-outlined">height</span></button>
        <button id="zoom-width" class="icon" title="Fit to width">
          <span class="material-symbols-outlined">width</span></button>
        <button id="zoom-100" class="small outlined" title="Default zoom (14 px per foot)">100%</button>
      </div>
      </span>
      <!-- ⭐ WHAT THE PDF WILL PRINT AT, at a glance. Jerry, 2026-10-01: "where
           is the scale", then "row under the export button". Moving the CONTROLS
           into Export was right — they change the exported PDF and nothing else,
           and side by side their dependence is finally visible — but the toolbar
           used to DISPLAY the scale at all times, and that readout went with
           them. Information that was ambient had become something to go and look
           for.

           ⚠ Pushed to the right of its row rather than pinned under the Export
           button itself: row one reflows as the window narrows, so any fixed
           alignment to one control in it would only be true at one width.

           It is a button, so it is keyboard-reachable and opens the same menu —
           a shortcut as well as a readout. -->
      <button id="sheetinfo" class="sheetinfo grow" aria-haspopup="menu"
              title="The sheet and scale the PDF will print at. Click to change them."></button>
      <div class="divider"></div>
    </div>
  </header>
  <main>
    <div id="canvas"><svg id="plot"></svg></div>
    <div id="splitter" role="separator" aria-orientation="vertical"
         title="Drag to resize the side panel · double-click to reset"></div>
    <aside>
      <!-- ⭐ CLOSED ON STARTUP. #56: "We can also have the show and venue tab close
           on start-up." It is the panel you fill in once and rarely reopen, and it
           was the first thing between the reader and the rig. -->
      <details class="panel details" id="panel-details">
        <summary>
          <span class="material-symbols-outlined chevron">expand_more</span>
          <span class="material-symbols-outlined">theater_comedy</span>
          <h2>Show &amp; Venue</h2>
          <span class="count" id="det-count"></span>
        </summary>
        <div class="body" id="details"></div>
      </details>
      <details class="panel instrument" id="panel-instrument" open>
        <summary>
          <span class="material-symbols-outlined chevron">expand_more</span>
          <span class="material-symbols-outlined">flashlight_on</span>
          <h2>Instrument</h2>
          <span class="count" id="inst-count"></span>
        </summary>
        <div class="body" id="inspector"></div>
      </details>
      <details class="panel positions" id="panel-positions" open>
        <summary>
          <span class="material-symbols-outlined chevron">expand_more</span>
          <span class="material-symbols-outlined">horizontal_rule</span>
          <h2>Positions</h2>
          <span class="count" id="pos-count"></span>
        </summary>
        <div class="body" id="positions"></div>
      </details>
      <details class="panel schedule" id="panel-schedule" open>
        <summary>
          <span class="material-symbols-outlined chevron">expand_more</span>
          <span class="material-symbols-outlined">table_rows</span>
          <h2>Schedule</h2>
          <span class="count" id="sched-count"></span>
        </summary>
        <div class="body">
          <table id="schedule"><thead><tr>
            <th>Pos</th><th>U</th><th>Ch</th><th>Type</th><th>Color</th>
            <th class="num">W</th>
            <th class="num" title="The dimmer, or the address where there is no dimmer">Dim/Addr</th>
          </tr></thead><tbody></tbody></table>
        </div>
      </details>
    </aside>
  </main>
  <div id="err" hidden></div>
  <script type="module" src="/src/main.ts"></script>
<!-- ⭐ SHEET, SCALE AND RULERS LIVE IN THE EXPORT MENU NOW. Jerry, #56: "the
     export menu is confusing it should be indented". All three affect the
     exported PDF and nothing else, so sitting in the toolbar beside the file
     actions made them read as app state.

     ⚠ THE CONTROLS THEMSELVES STAY HERE, HIDDEN, AND ARE THE STATE. They are
     filled by `fillPageMenu` and `fillScaleMenu`, which are unit-aware and carry
     a deliberate fallback — "the first is the SMALLEST, and silently issuing a
     D-sized plot on Letter is the kind of thing nobody notices until it is
     printed". Rewriting that to feed a menu would have risked losing the care in
     it for nothing, so the menu READS AND WRITES these and every existing
     `$("page").value` keeps working unchanged.

     `hidden` keeps them out of the tab order. They are a model, not a UI. -->
<div id="export-settings" hidden>
        <select id="page" title="The sheet the PDF is drawn on. Imperial plots are offered ARCH and ANSI sizes, metric ones the A series — a drawing issued on a sheet the reader does not stock is no more use than one at a ratio their rule does not have."></select>
        <select id="scale" title="Paper scale for the exported PDF. Fit picks the largest standard scale at which nothing runs off the sheet.">
          <option value="fit" selected>Fit</option>
          <!-- Filled from the plot's units at render time: imperial fractions or
               metric ratios, never both. Offering 1/4" on a metric plot would
               let somebody issue a drawing at a ratio their scale rule does not
               have on it. -->
        </select>
</div>
</body>
</html>
