name: CI

on: [push, pull_request]

jobs:
  tests:
    # ⭐ The suites first, because they are what has actually caught things.
    # Across a week of building this they found: a compound gel silently
    # reporting open white (729 fc where the truth was 169), LED fixtures
    # computed at the wrong output mode, an em dash breaking every download, a
    # boom raising UnboundLocalError after a refactor, and an API returning the
    # PREVIOUS instrument's pool. Pylint found none of them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"     # the code uses 3.10+ syntax; 3.12 is what it is developed on
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # ⚠ From the FILE, never a list typed here. A hand-written list is a
          # second place for dependencies to live, and it missed
          # python-multipart — which FastAPI needs but never imports by name.
          pip install -r server/requirements.txt
      - name: Python suites
        working-directory: server
        run: |
          for t in test_*.py; do echo "--- $t"; python "$t"; done
      - name: Every fixture is sourced, consistent and reachable
        # ⭐ This is what makes a contributed fixture reviewable. A diff does not
        # show that a field angle is narrower than its beam, or that an alias
        # points at a fixture that was renamed. A person checks what they think
        # to check; this checks the same things every time.
        working-directory: server
        run: python validate_fixtures.py

      - name: Verify the suites actually fail when broken
        # ⚠ Twice in one day a suite printed its verdict in the MIDDLE of the
        # file, so anything appended ran without affecting the exit code — it
        # could print failures and still exit 0. A suite that can pass while
        # failing is worse than no suite.
        working-directory: server
        run: python verify_suites.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install
        working-directory: web
        run: npm ci || npm install
      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit
      - name: Web suites
        working-directory: web
        run: npm run test:all

  pylint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint -r server/requirements.txt
      - name: Analysing the code with pylint
        # --errors-only, not the full run. A bare `pylint` scores this code
        # 7.87/10 and fails on missing docstrings and short names like a, b, cx
        # — which are the right names for a semi-major axis. A gate that is red
        # from the first push is a gate everyone learns to ignore.
        #
        # ⚠ E1136 disabled: 19 false positives, all of the shape
        #     _, row, note = lookup(kind)
        #     if row is None: return ...
        #     row["field"]        # <- pylint says unsubscriptable
        # The guard is right there and the tests cover every one of those paths.
        # The same pattern in isolation does NOT trip pylint, so it is a failure
        # of its inference on this module rather than something to code around.
        # Revisit if a future pylint narrows it.
        run: pylint --errors-only --disable=E1136 $(git ls-files '*.py')
