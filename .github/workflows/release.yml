# Build a download that someone who is not a developer can actually run.
#
# ⭐ The whole point is that the zip contains web/dist ALREADY BUILT, so the
# person unzipping it needs Python and nothing else. A git clone needs Node as
# well, which is one install too many for a lighting designer who wants to draw
# a plot.
#
# ⚠ The tests run first and the release is not built if they fail. A download
# that is broken is worse than no download: it is a first impression that cannot
# be taken back.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# 🔴 Without this the release step fails. GITHUB_TOKEN is read-only by default in
# repositories created since 2023, and softprops/action-gh-release needs to
# WRITE — the failure is a 403 at the very last step, after a green build.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -r server/requirements.txt

      - uses: actions/setup-node@v7
        with: { node-version: "20" }
      - run: npm install
        working-directory: web

      - name: Tests — Python
        run: |
          cd server
          for f in test_*.py; do echo "--- $f"; python "$f"; done
          python verify_suites.py

      - name: Tests — web
        run: |
          cd web
          npx tsc --noEmit
          npm run test:all

      - name: Build the editor
        run: npm run build
        working-directory: web

      - name: Assemble the download
        run: |
          mkdir -p out/plotedit out/plotedit/web
          cp -r server samples run.command run.bat README.md LICENSE out/plotedit/
          # ⭐ The version comes from the TAG and is written into the package.
          # A clone has no VERSION file and reports "dev", which is the honest
          # answer — the checkout could be anything. Only a build made from a
          # tag is allowed to claim a number.
          # ⚠ workflow_dispatch has no tag, so it is not given one either.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            printf '%s' "${GITHUB_REF_NAME#v}" > out/plotedit/server/plotedit/VERSION
            echo "packaged as ${GITHUB_REF_NAME#v}"
          else
            echo "not a tag build — no VERSION written, it will report dev"
          fi
          chmod +x out/plotedit/run.command
          cp -r web/dist out/plotedit/web/dist
          # 🔴 docs/ is copied WITHOUT docs/reference. That folder holds a copy
          # of USITT RP-2 (2006) — someone else's copyrighted standard, bought
          # to work from. It is gitignored, so a checkout does not have it and
          # this exclusion changes nothing today; it is here because the day it
          # does get committed, a release would quietly start redistributing it.
          # An exclusion in the packaging step is a fact; .gitignore is a hope.
          rsync -a --exclude 'reference/' docs/ out/plotedit/docs/
          # ⚠ Nothing only a developer needs: no node_modules, no .git.
          find out/plotedit -name '__pycache__' -type d -prune -exec rm -rf {} +
          cd out && zip -qr ../plotedit.zip plotedit

      - name: Refuse to ship the program without its licence
        run: |
          # 🔴 GPL section 4: "give all recipients a copy of this License along
          # with the Program." v0.1.1 shipped without it — LICENSE was added to
          # the repository and to the README, and the packaging step was never
          # updated, so the download pointed at a file it did not contain.
          # Nothing caught it because nothing looked.
          if ! unzip -Z1 plotedit.zip | grep -qx 'plotedit/LICENSE'; then
            echo "::error::plotedit.zip has no LICENSE — the GPL requires it to travel with the program"
            exit 1
          fi
          echo "LICENSE is in the download"

      - name: Refuse to ship anyone else's document
        run: |
          # A guard, not a hope. If a PDF or an office document ever reaches the
          # download, stop — a release cannot be unsent once someone has it.
          found=$(unzip -Z1 plotedit.zip | grep -iE '\.(pdf|docx?|xlsx?|pptx?)$' || true)
          if [ -n "$found" ]; then
            echo "::error::Documents in the release zip:"; echo "$found"; exit 1
          fi
          echo "no third-party documents in the download"

      # ⚠ These two run ONLY on a tag, so a push to a branch never exercises
      # them — the first time they run for real is a release nobody can take
      # back. Their inputs were checked against the new majors' own action.yml
      # rather than assumed: upload-artifact still takes name/path, and
      # action-gh-release v3 still takes files.
      - uses: actions/upload-artifact@v7
        with:
          name: plotedit
          path: plotedit.zip

      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: plotedit.zip
